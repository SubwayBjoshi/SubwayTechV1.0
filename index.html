
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"

<title>
Subway Insights
</title>

<style>

:root {

    --green:#006747;
    --dark:#004d35;
    --yellow:#ffc72c;
    --bg:#edf5ef;
    --white:#ffffff;
    --text:#17221b;

}

* {
    box-sizing:border-box;
}

body {

    margin:0;

    font-family:
        Arial,
        sans-serif;

    background:
        var(--bg);

    color:
        var(--text);

}

header {

    background:
        linear-gradient(
            135deg,
            var(--dark),
            var(--green)
        );

    color:white;

    padding:
        28px 40px;

}

main {

    max-width:
        1200px;

    margin:
        40px auto;

    padding:
        20px;

}

.card {

    background:
        white;

    border-radius:
        16px;

    padding:
        30px;

    box-shadow:
        0 8px 24px
        rgba(0,0,0,.07);

}

.button {

    display:
        inline-block;

    background:
        var(--green);

    color:
        white;

    padding:
        14px 24px;

    border-radius:
        9px;

    text-decoration:
        none;

    font-weight:
        bold;

}

</style>

</head>


<body>


<header>

Subway Insights
</h1>

</p>

</header>

</h2>
