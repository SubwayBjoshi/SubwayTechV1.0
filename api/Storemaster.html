<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Store Master | Subway Insights</title>

<style>
:root {
    --green:#006747;
    --dark:#004f35;
    --yellow:#ffc72c;
    --bg:#edf5ef;
    --white:#ffffff;
    --border:#d5e4da;
    --text:#17221b;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    font-family:Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}

header {
    background:var(--green);
    color:white;
    padding:18px 30px;
}

.header-row {
    display:flex;
    align-items:center;
    gap:25px;
}

.header-row a {
    color:white;
    text-decoration:none;
    font-weight:bold;
}

main {
    padding:30px;
}

.panel {
    background:white;
    padding:20px;
    border-radius:14px;
    border:1px solid var(--border);
    margin-bottom:20px;
}

.filters {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

input,
select {
    width:100%;
    padding:11px;
    border:1px solid var(--border);
    border-radius:8px;
}

.table-wrap {
    background:white;
    border-radius:14px;
    border:1px solid var(--border);
    overflow:auto;
    max-height:70vh;
}

table {
    width:100%;
    border-collapse:collapse;
    white-space:nowrap;
}

th {
    position:sticky;
    top:0;
    background:var(--green);
    color:white;
    padding:12px;
    text-align:left;
}

td {
    padding:10px 12px;
    border-bottom:1px solid #eee;
}

tbody tr:hover {
    background:#f2f8f4;
}

.status {
    margin-bottom:12px;
    font-weight:bold;
}

.error {
    color:#b42318;
}

@media(max-width:900px) {
    .filters {
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="header-row">
        <a href="index.html">← Home</a>
        <h2>Store Master</h2>
    </div>
</header>

<main>

<div class="panel">

    <div class="filters">

        <input
            id="search"
            type="text"
            placeholder="Search Store Code / Store Name"
        >

        <select id="region">
            <option value="">All Regions</option>
        </select>

        <select id="circle">
            <option value="">All Circles</option>
        </select>

        <select id="status">
            <option value="">All Status</option>
        </select>

    </div>

</div>

<div id="statusText" class="status">
    Loading Store Master...
</div>

<div class="table-wrap">

<table>

<thead>
<tr>
    <th>Store Code</th>
    <th>Store Name</th>
    <th>Type</th>
    <th>Region</th>
    <th>Circle</th>
    <th>City</th>
    <th>Format</th>
    <th>Cohort</th>
    <th>Status</th>
    <th>Area Manager</th>
</tr>
</thead>

<tbody id="storeRows"></tbody>

</table>

</div>

</main>

<script>

let stores = [];


/* ------------------------------
   LOAD STORE MASTER
------------------------------ */

async function loadStoreMaster() {

    const status =
        document.getElementById("statusText");

    try {

        status.textContent =
            "Loading Store Master...";

        const response =
            await fetch(
                "/api/redash?dataset=storeMaster"
            );

        const text =
            await response.text();

        if (!response.ok) {
            throw new Error(
                `API Error ${response.status}: ${text}`
            );
        }

        if (!text) {
            throw new Error(
                "Store Master API returned empty response."
            );
        }

        const result =
            JSON.parse(text);

        stores =
            Array.isArray(result.rows)
                ? result.rows
                : [];

        populateFilters();

        renderStores();

    } catch(error) {

        console.error(error);

        status.innerHTML =
            `<span class="error">${escapeHtml(error.message)}</span>`;

    }

}


/* ------------------------------
   POPULATE FILTERS
------------------------------ */

function populateFilters() {

    fillSelect(
        "region",
        stores.map(x => x.Region),
        "All Regions"
    );

    fillSelect(
        "circle",
        stores.map(x => x.Circle),
        "All Circles"
    );

    fillSelect(
        "status",
        stores.map(x => x.Status),
        "All Status"
    );

}


function fillSelect(id, values, label) {

    const select =
        document.getElementById(id);

    const uniqueValues =
        [...new Set(
            values
                .filter(Boolean)
                .map(x => String(x).trim())
        )]
        .sort();

    select.innerHTML =
        `<option value="">${label}</option>`;

    uniqueValues.forEach(value => {

        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = value;

        select.appendChild(option);

    });

}


/* ------------------------------
   FILTER + DISPLAY
------------------------------ */

function renderStores() {

    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();

    const region =
        document.getElementById("region").value;

    const circle =
        document.getElementById("circle").value;

    const status =
        document.getElementById("status").value;


    const filtered =
        stores.filter(row => {

            const code =
                getValue(
                    row,
                    "Store_Code",
                    "Store Code",
                    "storecode"
                );

            const name =
                getValue(
                    row,
                    "Store_Name",
                    "Store Name",
                    "storename"
                );

            const matchesSearch =
                !search ||
                code.toLowerCase().includes(search) ||
                name.toLowerCase().includes(search);

            const matchesRegion =
                !region ||
                String(row.Region || "") === region;

            const matchesCircle =
                !circle ||
                String(row.Circle || "") === circle;

            const matchesStatus =
                !status ||
                String(row.Status || "") === status;

            return (
                matchesSearch &&
                matchesRegion &&
                matchesCircle &&
                matchesStatus
            );

        });


    const tbody =
        document.getElementById("storeRows");


    tbody.innerHTML =
        filtered.map(row => `

            <tr>

                <td>
                    ${safe(getValue(
                        row,
                        "Store_Code",
                        "Store Code",
                        "storecode"
                    ))}
                </td>

                <td>
                    ${safe(getValue(
                        row,
                        "Store_Name",
                        "Store Name",
                        "storename"
                    ))}
                </td>

                <td>${safe(row.Type)}</td>

                <td>${safe(row.Region)}</td>

                <td>${safe(row.Circle)}</td>

                <td>${safe(row.City)}</td>

                <td>${safe(row.Format)}</td>

                <td>${safe(row.Cohort)}</td>

                <td>${safe(row.Status)}</td>

                <td>
                    ${safe(
                        row.Area_Manager ||
                        row["Area Manager"]
                    )}
                </td>

            </tr>

        `).join("");


    document.getElementById(
        "statusText"
    ).textContent =
        `${filtered.length.toLocaleString("en-IN")} stores shown`;

}


/* ------------------------------
   HELPERS
------------------------------ */

function getValue(row, ...keys) {

    for (const key of keys) {

        if (
            row[key] !== undefined &&
            row[key] !== null
        ) {
            return String(row[key]);
        }

    }

    return "";

}


function safe(value) {

    return escapeHtml(
        value ?? ""
    );

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ------------------------------
   EVENTS
------------------------------ */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderStores
    );

document
    .getElementById("region")
    .addEventListener(
        "change",
        renderStores
    );

document
    .getElementById("circle")
    .addEventListener(
        "change",
        renderStores
    );

document
    .getElementById("status")
    .addEventListener(
        "change",
        renderStores
    );


loadStoreMaster();

</script>

</body>
</html>
